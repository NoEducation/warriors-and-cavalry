<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Warriors and Cavalry</title>
    <link rel="stylesheet" href="/src/ui/colors.css" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--black);
      }
      #game {
        display: block;
        width: 100vw;
        height: 100vh;
        image-rendering: pixelated;
      }
      /* A faint darkening at the edges of the view; clicks pass through. (Mist lives in the world: MountainMist.) */
      #vignette {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(ellipse at center, transparent 60%, var(--shadow-25) 100%);
      }
      #error {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        color: var(--white);
      }
      #error[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="vignette"></div>
    <div id="hud"></div>
    <div id="resources" class="panel"></div>
    <div id="buildbar" class="panel"></div>
    <div id="menu" hidden></div>
    <div id="loading" hidden></div>
    <div id="error" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
