<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Warriors and Cavalry</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      #game {
        display: block;
        width: 100vw;
        height: 100vh;
        image-rendering: pixelated;
      }
      #hud {
        position: absolute;
        top: 0;
        left: 0;
        padding: 4px 8px;
        font-family: monospace;
        color: #fff;
        background: rgba(0, 0, 0, 0.5);
      }
      #resources {
        position: absolute;
        top: 0;
        left: 50%;
        transform: translateX(-50%);
        padding: 4px 8px;
        font-family: monospace;
        color: #fff;
        background: rgba(0, 0, 0, 0.5);
        white-space: nowrap;
      }
      #resources .full {
        color: #ffdc50;
        font-weight: bold;
      }
      /* Below this width the longest tile line could reach the resource bar, so the HUD moves below it. */
      @media (max-width: 1400px) {
        #hud {
          top: 24px;
        }
      }
      #buildbar {
        position: absolute;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 4px;
        padding: 4px 8px;
        font-family: monospace;
        color: #fff;
        background: rgba(0, 0, 0, 0.5);
      }
      #buildbar button {
        font-family: monospace;
        color: #fff;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.4);
        padding: 2px 5px;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        align-items: center;
        white-space: nowrap;
      }
      #buildbar button .cost {
        font-size: 0.8em;
        opacity: 0.8;
      }
      #buildbar button.unaffordable {
        opacity: 0.45;
      }
      #buildbar button.unaffordable .cost {
        color: #ff8080;
        opacity: 1;
      }
      #buildbar button.active {
        background: rgba(255, 220, 80, 0.35);
        border-color: #ffdc50;
      }
      /* Narrow windows: smaller buttons so all eight fit in one row. */
      @media (max-width: 700px) {
        #buildbar {
          gap: 2px;
          padding: 3px 4px;
        }
        #buildbar button {
          font-size: 10px;
          padding: 2px 3px;
        }
      }
      #error {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        color: #fff;
      }
      #error[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="hud"></div>
    <div id="resources"></div>
    <div id="buildbar"></div>
    <div id="error" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
